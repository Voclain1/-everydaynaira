<svg width="260" height="64" viewBox="0 0 260 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="EverydayNaira">
  <!-- Icon box (lime on dark bg) -->
  <rect width="52" height="52" rx="9" fill="#B5D229"/>
  <!-- ₦ verticals -->
  <line x1="16" y1="12" x2="16" y2="40" stroke="#14140F" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="36" y1="12" x2="36" y2="40" stroke="#14140F" stroke-width="3.5" stroke-linecap="round"/>
  <!-- ₦ diagonal -->
  <line x1="14" y1="14" x2="38" y2="38" stroke="#14140F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dark crossbars -->
  <line x1="11" y1="22" x2="41" y2="22" stroke="#14140F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="30" x2="41" y2="30" stroke="#14140F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="64" y="33" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="26" font-weight="800" fill="#F0EFE9" letter-spacing="1">EVERYDAYNAIRA</text>
  <!-- Tagline -->
  <text x="65" y="50" font-family="'Barlow', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9B9A90" letter-spacing="0.3">Your money, explained simply</text>
</svg>
