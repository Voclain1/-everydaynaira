name: One-time approved photo import
on:
  push:
    branches: ["content/topical-authority-sprint-01-2026-11-19"]
    paths: [".github/workflows/import-approved-images.yml", "scripts/import-approved-images.mjs"]
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Retrieve, verify SHA-256 and optimise eight approved editorial images
        run: node scripts/import-approved-images.mjs
      - name: Commit only approved WebP cover images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/posts/
          git diff --cached --quiet && exit 0
          git commit -m "assets: add eight approved EverydayNaira editorial photographs"
          git push origin HEAD:content/topical-authority-sprint-01-2026-11-19
