name: Sprint 03 live host diagnostics
on:
  push:
    branches: ["seo/sprint-03-indexing-canonical-and-ctr"]
    paths: [".github/workflows/seo-live-host-diagnostic.yml", "scripts/diagnose-live-hosts.mjs"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-live-hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect apex and www redirects, canonicals, sitemap
        run: node scripts/diagnose-live-hosts.mjs
